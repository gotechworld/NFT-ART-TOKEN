[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 1_000, max_test_rejects = 65536 }
invariant = { runs = 256, depth = 15, fail_on_revert = true }
gas_reports = ["ArtToken"]
ffi = false
sender = "0x3486D5dDA991b8f1d3cF96c2DAC1a863446385e9"

[profile.ci]
fuzz = { runs = 5_000, max_test_rejects = 131072 }
invariant = { runs = 512, depth = 25, fail_on_revert = true }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"